<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon-singleredbox.png" />
    <link rel="apple-touch-icon" href="/brand/favicon-singleredbox.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Warms up the connection to Google's map embed domains ahead of time,
         so the Contact page's iframe doesn't pay the DNS/TLS handshake cost
         only once it's actually requested. -->
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://maps.google.com" />
    <link rel="preconnect" href="https://maps.gstatic.com" crossorigin />
    <!-- Default matches the site's default language (Arabic). App.jsx updates
         this on mount to match the visitor's saved language choice. -->
    <title>سَمْدَان · أصالة الضيافة السعودية</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
