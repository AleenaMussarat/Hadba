<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SAMDAN Menu QR Card</title>
<style>
  @font-face {
    font-family: 'Montserrat';
    src: local('Montserrat');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1000px;
    height: 1400px;
  }
  body {
    font-family: 'Montserrat', Arial, sans-serif;
    background: radial-gradient(circle at 30% 20%, #241b17 0%, #120e0c 70%);
    color: #F5ECE1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 860px;
    height: 1260px;
    border: 2px solid rgba(246, 157, 28, 0.35);
    border-radius: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 70px 60px;
    text-align: center;
    background: rgba(29, 22, 19, 0.4);
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 90px;
    height: 90px;
    border-radius: 22px;
    background: #BC3433;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
  }
  .brand h1 {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 2px;
  }
  .brand h1 span {
    color: #F69D1C;
  }
  .brand p {
    font-size: 18px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #C7B9A8;
  }
  .qr-wrap {
    background: #fff;
    border-radius: 32px;
    padding: 36px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .qr-wrap img {
    width: 460px;
    height: 460px;
    display: block;
  }
  .caption h2 {
    font-size: 40px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .caption p.ar {
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .caption p.sub {
    font-size: 20px;
    color: #C7B9A8;
    max-width: 560px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">🍖</div>
      <h1>SAMD<span>AN</span></h1>
      <p>Saudi Heritage Dining</p>
    </div>

    <div class="qr-wrap">
      <img src="menu-qr.png" alt="QR code to SAMDAN menu" />
    </div>

    <div class="caption">
      <h2>Scan for our Menu</h2>
      <p class="ar">امسح لعرض القائمة</p>
      <p class="sub">Point your camera at the code to explore our full menu of Kabsa, Jarish, Najdi &amp; Hejazi specialties.</p>
    </div>
  </div>
</body>
</html>
